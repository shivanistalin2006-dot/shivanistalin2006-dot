<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <radialGradient id="phil-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#18130a" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>

    <linearGradient id="gold-phil-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE58F" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF8D6" />
      <stop offset="75%" stop-color="#A88920" />
      <stop offset="100%" stop-color="#F5D76E" />
    </linearGradient>

    <filter id="gold-glow-p">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .p-header { font-family: 'Fira Code', monospace; font-size: 16px; font-weight: 700; fill: #D4AF37; letter-spacing: 4px; text-anchor: middle; }
      .p-quote1 { font-family: 'Cinzel', 'Playfair Display', 'Georgia', serif; font-size: 26px; font-weight: 600; font-style: italic; fill: url(#gold-phil-grad); filter: url(#gold-glow-p); text-anchor: middle; }
      .p-quote2 { font-family: 'Cinzel', 'Playfair Display', 'Georgia', serif; font-size: 26px; font-weight: 700; font-style: italic; fill: #FFF8D6; filter: url(#gold-glow-p); text-anchor: middle; }
    </style>
  </defs>

  <rect width="900" height="220" rx="14" fill="url(#phil-bg)" stroke="#D4AF37" stroke-width="1.5" opacity="0.95" />
  
  <text x="450" y="45" class="p-header">🏆 DEVELOPER PHILOSOPHY</text>
  <line x1="350" y1="58" x2="550" y2="58" stroke="#8B0000" stroke-width="1.5" />

  <text x="450" y="115" class="p-quote1">"I don't just want to write code that works.</text>
  <text x="450" y="158" class="p-quote2">I want to build experiences that people remember."</text>

  <!-- Decorative Accents -->
  <circle cx="150" cy="135" r="3" fill="#D4AF37" filter="url(#gold-glow-p)" />
  <circle cx="750" cy="135" r="3" fill="#D4AF37" filter="url(#gold-glow-p)" />
</svg>
