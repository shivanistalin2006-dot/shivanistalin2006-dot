<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c160c" />
      <stop offset="60%" stop-color="#080808" />
      <stop offset="100%" stop-color="#030303" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE58F" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF8D6" />
      <stop offset="75%" stop-color="#A88920" />
      <stop offset="100%" stop-color="#F5D76E" />
    </linearGradient>

    <!-- Soft Gold Metallic -->
    <linearGradient id="gold-soft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A88920" />
      <stop offset="50%" stop-color="#F5D76E" />
      <stop offset="100%" stop-color="#A88920" />
    </linearGradient>

    <!-- Crimson Accent Gradient -->
    <linearGradient id="crimson-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5C0000" />
      <stop offset="50%" stop-color="#8B0000" />
      <stop offset="100%" stop-color="#D32F2F" />
    </linearGradient>

    <!-- Gold Glow Filter -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="0.8"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Crimson Glow -->
    <filter id="crimson-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .brand-title {
        font-family: 'Cinzel', 'Playfair Display', 'Times New Roman', 'Georgia', serif;
        font-size: 56px;
        font-weight: 700;
        letter-spacing: 10px;
        fill: url(#gold-gradient);
        filter: url(#gold-glow);
        text-anchor: middle;
      }
      .brand-subtitle {
        font-family: 'Fira Code', 'Courier New', monospace, sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 6px;
        fill: #F5D76E;
        text-anchor: middle;
        opacity: 0.95;
      }
      .brand-slogan {
        font-family: 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
        font-size: 16px;
        font-style: italic;
        letter-spacing: 2px;
        fill: #C0C0C0;
        text-anchor: middle;
      }
      .card-border {
        stroke: url(#gold-soft);
        stroke-width: 1.5;
        fill: none;
      }
      .crimson-line {
        stroke: url(#crimson-gradient);
        stroke-width: 2;
        filter: url(#crimson-glow);
      }
      .gold-dot {
        fill: #D4AF37;
        filter: url(#gold-glow);
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="320" rx="16" fill="url(#bg-glow)" />

  <!-- Outer Luxury Gold Border -->
  <rect x="12" y="12" width="976" height="296" rx="12" class="card-border" opacity="0.7" />
  <rect x="18" y="18" width="964" height="284" rx="10" stroke="#8B0000" stroke-width="0.7" fill="none" opacity="0.4" />

  <!-- Corner Gold Accents -->
  <path d="M 24 40 L 24 24 L 40 24" stroke="#D4AF37" stroke-width="2.5" fill="none" />
  <path d="M 976 40 L 976 24 L 960 24" stroke="#D4AF37" stroke-width="2.5" fill="none" />
  <path d="M 24 280 L 24 296 L 40 296" stroke="#D4AF37" stroke-width="2.5" fill="none" />
  <path d="M 976 280 L 976 296 L 960 296" stroke="#D4AF37" stroke-width="2.5" fill="none" />

  <!-- Top Accent Diamond -->
  <polygon points="500,32 506,38 500,44 494,38" fill="#D4AF37" filter="url(#gold-glow)" />
  <line x1="320" y1="38" x2="480" y2="38" class="crimson-line" />
  <line x1="520" y1="38" x2="680" y2="38" class="crimson-line" />

  <!-- Main Glowing Gold Title -->
  <text x="500" y="135" class="brand-title">SHIVANI STALIN</text>

  <!-- Center Decorative Line -->
  <line x1="380" y1="165" x2="470" y2="165" stroke="url(#gold-soft)" stroke-width="1" />
  <circle cx="500" cy="165" r="4" class="gold-dot" />
  <line x1="530" y1="165" x2="620" y2="165" stroke="url(#gold-soft)" stroke-width="1" />

  <!-- Subtitle -->
  <text x="500" y="210" class="brand-subtitle">DEVELOPER • PROBLEM SOLVER • CURIOUS BUILDER</text>

  <!-- Supporting Slogan -->
  <text x="500" y="248" class="brand-slogan">"Turning ideas into interactive digital experiences."</text>

  <!-- Bottom Accent -->
  <line x1="440" y1="275" x2="560" y2="275" stroke="url(#gold-gradient)" stroke-width="1.5" opacity="0.8" />
</svg>
